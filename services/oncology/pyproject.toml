[project]
name = "oncology-workbench"
version = "0.1.0"
description = "Local learning prototype for oncology evidence retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.138.2",
  "uvicorn==0.38.0",
  "pydantic==2.12.4",
]

[dependency-groups]
dev = ["pytest==7.4.4", "httpx==0.28.1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
