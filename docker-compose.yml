name: biomed

x-app-environment: &app-environment
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.124.2}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DATABASE_PATH: /app/var/db.sqlite3
  EVIDENCE_API_URL: http://oncology:8000
  CURATION_STORAGE_DIR: /app/library
  CURATION_MODEL_BACKEND: ${CURATION_MODEL_BACKEND:-}
  KNOWLEDGE_DIR: /data/knowledge
  KNOWLEDGE_UPDATES_DIR: /data/knowledge-updates
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_TRUST_X_FORWARDED_PROTO: ${DJANGO_TRUST_X_FORWARDED_PROTO:-0}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-0}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-0}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  BIOTOOLS_API_KEYS: ${BIOTOOLS_API_KEYS:-}
  BIOTOOLS_REQUIRE_API_KEY: ${BIOTOOLS_REQUIRE_API_KEY:-0}
  BIOTOOLS_ANNOTATION_RATE: ${BIOTOOLS_ANNOTATION_RATE:-30/min}
  BIOTOOLS_JOB_COOLDOWN_SECONDS: ${BIOTOOLS_JOB_COOLDOWN_SECONDS:-10}
  BIOTOOLS_JOB_STALE_AFTER_SECONDS: ${BIOTOOLS_JOB_STALE_AFTER_SECONDS:-1800}
  BIOTOOLS_WORKER_POLL_SECONDS: ${BIOTOOLS_WORKER_POLL_SECONDS:-1}
  BIOTOOLS_TRUST_X_FORWARDED_FOR: ${BIOTOOLS_TRUST_X_FORWARDED_FOR:-0}
  ANNOTATION_MAX_VARIANTS: ${ANNOTATION_MAX_VARIANTS:-200}
  VEP_BIN: ${VEP_BIN:-/opt/vep/src/ensembl-vep/vep}
  VEP_CACHE_DIR: /data/vep
  VEP_ASSEMBLY: ${VEP_ASSEMBLY:-GRCh37}
  VEP_MODE: ${VEP_MODE:-local}
  VEP_MAX_CONCURRENCY: ${VEP_MAX_CONCURRENCY:-2}
  VEP_TIMEOUT_SECONDS: ${VEP_TIMEOUT_SECONDS:-300}
  VEP_DOCKER_IMAGE: ${VEP_DOCKER_IMAGE:-ensemblorg/ensembl-vep:release_116.0}
  ANNOVAR_MODE: ${ANNOVAR_MODE:-local}
  ANNOVAR_DB_DIR: /data/annovar
  ANNOVAR_PUBLIC_ENABLED: ${ANNOVAR_PUBLIC_ENABLED:-0}
  ANNOVAR_DOCKER_IMAGE: ${ANNOVAR_DOCKER_IMAGE:-registry.cn-shanghai.aliyuncs.com/kszy-biosoft/annovar:v20180416_2}
  ANNOVAR_TABLE_BIN: ${ANNOVAR_TABLE_BIN:-/home/TOOLS/tools/annovar/current/bin/table_annovar.pl}
  ANNOVAR_MAX_CONCURRENCY: ${ANNOVAR_MAX_CONCURRENCY:-1}
  ANNOVAR_TIMEOUT_SECONDS: ${ANNOVAR_TIMEOUT_SECONDS:-300}

x-app-volumes: &app-volumes
  - ./var/django:/app/var
  - ./var/library:/app/library
  # Reuse the verified runtime; code and assets come only from this project.
  - ./config:/app/config:ro
  - ./apps:/app/apps:ro
  - ./manage.py:/app/manage.py:ro
  - ./scripts/import_gene_knowledge.py:/app/scripts/import_gene_knowledge.py:ro
  - ./reference-manifest.yaml:/app/reference-manifest.yaml:ro
  - ./staticfiles:/app/staticfiles:ro
  - ${KNOWLEDGE_HOST_DIR:-./data/knowledge}:/data/knowledge:ro
  - ${KNOWLEDGE_UPDATES_HOST_DIR:-./data/knowledge-updates}:/data/knowledge-updates
  - ${VEP_HOST_CACHE:-./var/reference/vep}:/data/vep:ro
  - ${VEP_HOST_CACHE_GRCh37:-./var/reference/vep/homo_sapiens_merged/116_GRCh37}:/data/vep/homo_sapiens_merged/116_GRCh37:ro
  - ${ANNOVAR_HOST_DB:-./var/reference/annovar/humandb}:/data/annovar:ro

services:
  web:
    build: .
    image: ${BIOMED_IMAGE:-biomed-web:curation-20261012}
    container_name: biomed-web
    depends_on:
      oncology:
        condition: service_healthy
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 320"]
    ports:
      - "${BIOTOOLS_HOST_PORT:-${BIOTOOLS_PORT:-50011}}:8000"
    environment: *app-environment
    volumes: *app-volumes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  annotation-worker:
    image: ${BIOMED_IMAGE:-biomed-web:curation-20261012}
    container_name: biomed-annotation-worker
    command: ["python", "manage.py", "run_annotation_worker"]
    depends_on:
      web:
        condition: service_healthy
    environment: *app-environment
    volumes: *app-volumes
    restart: unless-stopped
    # The web image's HTTP probe does not apply to a queue consumer.
    healthcheck:
      disable: true

  worker:
    image: ${BIOMED_IMAGE:-biomed-web:curation-20261012}
    container_name: biomed-worker
    command: ["python", "manage.py", "curation_worker"]
    depends_on:
      web:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - ./var/django:/app/var
      - ./var/library:/app/library
      - ./config:/app/config:ro
      - ./apps:/app/apps:ro
      - ./manage.py:/app/manage.py:ro
      - ${KNOWLEDGE_HOST_DIR:-./data/knowledge}:/data/knowledge:ro
      - ${KNOWLEDGE_UPDATES_HOST_DIR:-./data/knowledge-updates}:/data/knowledge-updates
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "curation_worker_health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  oncology:
    build: ./services/oncology
    image: biomed-oncology:local
    container_name: biomed-oncology
    user: "${ONCO_UID:-1000}:${ONCO_GID:-1000}"
    expose:
      - "8000"
    volumes:
      - ./var/oncology:/app/var
      - ./services/oncology/src:/app/src:ro
      - ./services/oncology/data/demo:/app/data/demo:ro
    environment:
      ONCO_DATA_DIR: /app/var
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    ipam:
      config:
        - subnet: "${ONCO_SUBNET:-10.254.220.0/28}"
