name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python manage.py test apps.curation apps.annotations apps.evidence apps.portal --noinput

  oncology:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/oncology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --locked --group dev
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 uv run --locked pytest -q
