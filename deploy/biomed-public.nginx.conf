# Exact public hostname; the upstream itself enforces authenticated sessions.
limit_req_zone $binary_remote_addr zone=biomed_public_login:1m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name biomed.qzhqzh.com;
    return 301 https://biomed.qzhqzh.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name biomed.qzhqzh.com;
    server_tokens off;
    client_max_body_size 21m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 320s;
    proxy_cookie_flags sessionid secure httponly samesite=lax;
    proxy_cookie_flags csrftoken secure samesite=lax;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ^~ /health/ { return 404; }

    location = /accounts/login/ {
        limit_req zone=biomed_public_login burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:50011;
    }

    location / {
        proxy_pass http://127.0.0.1:50011;
    }
}
